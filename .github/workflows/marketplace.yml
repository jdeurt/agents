name: Marketplace
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
permissions:
  contents: read
concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run check-types
      - run: bun run format:check
      - run: bun run imports:check
      - run: bun run build
      - run: bun run check
      - run: bun test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke-test installed React Doctor
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/src"
          cat > "$fixture/package.json" <<'EOF'
          {"name":"react-doctor-smoke","private":true,"type":"module","dependencies":{"react":"19.2.0","react-doctor":"0.9.18"}}
          EOF
          cat > "$fixture/src/View.tsx" <<'EOF'
          import { useState } from "react";
          export function View({ ready }: { ready: boolean }) {
            if (ready) useState(0);
            return <img src="/missing.png" />;
          }
          EOF
          cd "$fixture"
          bun install --ignore-scripts
          node node_modules/react-doctor/bin/react-doctor.js src/View.tsx --json --lint --no-cache --no-supply-chain --no-score --blocking none --max-duration 8 > report.json
          node -e 'const r=require("./report.json"); if(!r.ok || r.projects?.some(p=>p.skippedChecks?.includes("lint")) || !r.diagnostics?.length) process.exit(1); console.log(`React Doctor: ${r.diagnostics.length} finding(s)`);'
      - run: bun run publish:marketplace -- --dry-run
      - name: Smoke-test native Codex installation
        run: |
          bun run build -- --output .marketplace-build
          bunx @openai/codex@0.162.0 plugin marketplace add "$GITHUB_WORKSPACE/.marketplace-build" --json
          bunx @openai/codex@0.162.0 plugin add jdeurt-design@agents --json
          bunx @openai/codex@0.162.0 plugin add jdeurt-engineering@agents --json
      - name: Smoke-test packaged edit hook and private dependencies
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/project" "$fixture/cache"
          printf 'const value=  1\nconsole.log(missing)\n' > "$fixture/project/source.js"
          printf '{"cwd":"%s","tool_name":"Write","tool_input":{"file_path":"%s"}}\n' "$fixture/project" "$fixture/project/source.js" |
            XDG_CACHE_HOME="$fixture/cache" bun .marketplace-build/dist/codex/plugins/engineering/scripts/post-edit.ts > "$fixture/result.json"
          node -e 'const fs=require("fs");const path=process.argv[1];const result=JSON.parse(fs.readFileSync(path+"/result.json","utf8"));const note=result.hookSpecificOutput.additionalContext;if(!note.includes("no-undef")||!note.includes("re-read file"))process.exit(1);if(fs.readFileSync(path+"/project/source.js","utf8")!=="const value = 1;\nconsole.log(missing);\n")process.exit(1);const cache=path+"/cache/jdeurt-engineering";if(!fs.existsSync(cache)||!fs.readdirSync(cache).some(name=>fs.existsSync(cache+"/"+name+"/.ready")))process.exit(1);' "$fixture"
  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run publish:marketplace
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: marketplace
          path: .marketplace-verify
          persist-credentials: false
      - name: Verify published marketplace installs in Codex
        run: |
          bunx @openai/codex@0.162.0 plugin marketplace add "$GITHUB_WORKSPACE/.marketplace-verify" --json
          bunx @openai/codex@0.162.0 plugin add jdeurt-design@agents --json
          bunx @openai/codex@0.162.0 plugin add jdeurt-engineering@agents --json
          bunx @openai/codex@0.162.0 plugin add jdeurt-meta@agents --json
          bunx @openai/codex@0.162.0 plugin add jdeurt-writing@agents --json
          bunx @openai/codex@0.162.0 plugin add jdeurt-cloudflare@agents --json
